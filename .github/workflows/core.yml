name: core

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # There is no wrapper in this repo on purpose: it is committed from a
      # phone. So Gradle itself has to be installed here.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Compile and test
        id: build
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :core:build 2>&1 | tee build.log

      # Action logs live on storage that is awkward to read from anywhere but a
      # browser. On a failure the interesting part gets filed as an issue, so
      # the error is readable through the API like everything else.
      - name: File the failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Commit \`${GITHUB_SHA:0:7}\` failed to build."
            echo
            echo '```'
            grep -E "^e: |^w: |FAILURE|What went wrong|Caused by|> " build.log | head -60 || tail -60 build.log
            echo '```'
          } > body.md
          gh issue create --title "build failed on ${GITHUB_SHA:0:7}" --body-file body.md --label "" || true
