name: core

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # There is no wrapper in this repo on purpose: it is committed from a
      # phone. So Gradle itself has to be installed here.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Compile and test
        id: build
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace :core:build :app:assembleDebug 2>&1 | tee build.log

      # Action logs live on storage that is awkward to read from anywhere but a
      # browser. On a failure the interesting part gets filed as an issue, so
      # the error is readable through the API like everything else.
      # A green build does not prove ndk-build ran. This looks inside the apk
      # and fails if the native tunnel is not actually in there.
      - name: Check the native library landed
        run: |
          apk=$(find app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "apk: $apk"
          unzip -l "$apk" | grep -E 'lib/.*\.so' || true
          if ! unzip -l "$apk" | grep -q 'libhev-socks5-tunnel.so'; then
            echo "native tunnel missing from the apk"
            exit 1
          fi

      - name: Keep the apk
        uses: actions/upload-artifact@v4
        with:
          name: gozar-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: File the failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/report-failure.sh
