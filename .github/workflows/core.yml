name: core

on:
  push:
    paths: ["core/**", "engines/**", "go.mod", "go.sum", ".github/workflows/core.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Resolve dependencies
        run: go mod tidy

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Commit go.sum if it changed
        run: |
          if ! git diff --quiet go.mod go.sum; then
            git config user.name "amirmahdavi2023 🪁"
            git config user.email "amirmahdavi2023@users.noreply.github.com"
            git add go.mod go.sum
            git commit -m "deps: lock resolved versions"
            git push
          fi
